<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Student Hub Portal</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>


<body>


<div class="sidebar">

    <div class="logo">

    <img src="images/profile.png" alt="Student Logo">

    <h2>Student Hub</h2>

</div>


    <ul>

        <li>
            <a href="index.html">
                <i class="fa fa-home"></i> Home
            </a>
        </li>

        <li>
            <a href="student.html">
                <i class="fa fa-user"></i> Student
            </a>
        </li>

        <li>
            <a href="courses.html">
                <i class="fa fa-book"></i> Courses
            </a>
        </li>

        <li>
            <a href="notice.html">
                <i class="fa fa-bell"></i> Notice
            </a>
        </li>

        <li>
            <a class="active" href="login.html">
                <i class="fa fa-sign-in"></i> Login
            </a>
        </li>

        <li>
            <a href="contact.html">
                <i class="fa fa-phone"></i> Contact
            </a>
        </li>

    </ul>

</div>




<div class="main">


<div class="topbar">

    <h2>Login</h2>

</div>




<section>


<div class="section-title">

<h2>Student Login</h2>

<p>
Login to access your Student Hub account
</p>

<p style="margin-top: 8px; color: #083f82; font-size: 14px;">
Secure student access portal
</p>

</div>




<form>

<label>Student Name</label>
<input type="text" id="studentName" placeholder="Enter your name">

<label>Student ID</label>
<input type="text" id="studentId" placeholder="Enter your student ID">

<label>Email</label>
<input type="email" id="email" placeholder="Enter your email">


<label>Semester</label>
<input type="text" id="semester" placeholder="Enter your semester">

<label>Contact Number</label>
<input type="text" id="contactNumber" placeholder="Enter your contact number">

<label>Password</label>
<input type="password" id="password" placeholder="Enter your password">

<label>Profile Picture</label>
<input type="file" id="profilePic" accept="image/*">

<button type="submit">
Login
</button>

</form>



</section>




<footer>

<p>
© 2026 Student Hub Portal. All Rights Reserved.
</p>

</footer>



</div>

<script src="javascript/auth.js"></script>
<script src="javascript/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
