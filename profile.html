<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile - Student Hub Portal</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Icons -->
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">

    <img src="images/profile.png" alt="Student Logo">

    <h2>Student Hub</h2>

</div>

    <ul>

        <li>
            <a href="index.html">
                <i class="fa fa-home"></i> Home
            </a>
        </li>


        <li>
            <a href="student.html">
                <i class="fa fa-user"></i> Student
            </a>
        </li>


        <li>
            <a href="courses.html">
                <i class="fa fa-book"></i> Courses
            </a>
        </li>


        <li>
            <a href="assignment.html">
                <i class="fa fa-file"></i> Assignment
            </a>
        </li>


        <li>
            <a href="attendance.html">
                <i class="fa fa-calendar"></i> Attendance
            </a>
        </li>


        <li>
            <a class="active" href="profile.html">
                <i class="fa fa-id-card"></i> Profile
            </a>
        </li>


        <li>
            <a href="faculty.html">
                <i class="fa fa-users"></i> Faculty
            </a>
        </li>


        <li>
            <a href="contact.html">
                <i class="fa fa-phone"></i> Contact
            </a>
        </li>


    </ul>

</div>




<!-- MAIN AREA -->

<div class="main">


    <!-- TOP BAR -->

    <div class="topbar">

        <h2>Student Profile</h2>

        <button class="btn logout-btn">Logout</button>

       <div class="profile">

    <img class="student-profile" src="images/profile.png" alt="Profile">

    <span class="student-name"></span>                   

</div>

    </div>



    <!-- CONTENT -->


    <section>


        <div class="card">


            <h2>Profile Information</h2>


            <br>


            <fieldset>


                <legend>
                    <b>Student Details</b>
                </legend>


                        <p>
                    <strong>Name:</strong>
                    <span class="student-name"></span>
                </p>

                <p>
                    <strong>Enrollment No:</strong>
                    <span class="student-id"></span>
                </p>

                <p>
                    <strong>Department:</strong>
                    <span class="student-department"></span>
                </p>

                <p>
                    <strong>Semester:</strong>
                    <span class="student-semester"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span class="student-email"></span>
                </p>

                <p>
                    <strong>Phone:</strong>
                    <span class="student-phone"></span>
                </p>


            </fieldset>


        </div>


    </section>




<footer>

    <p>
        © 2026 Student Hub Portal. All Rights Reserved.
    </p>

</footer>



</div>

<script src="javascript/auth.js"></script>
<script src="javascript/script.js"></script>
</body>

</html>
