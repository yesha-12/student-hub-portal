<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile - Student Hub Portal</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Icons -->
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">

    <img src="images/profile.png" alt="Student Logo">

    <h2>Student Hub</h2>

</div>

    <ul>

        <li>
            <a href="index.html">
                <i class="fa fa-home"></i> Home
            </a>
        </li>


        <li>
            <a href="student.html">
                <i class="fa fa-user"></i> Student
            </a>
        </li>


        <li>
            <a href="courses.html">
                <i class="fa fa-book"></i> Courses
            </a>
        </li>


        <li>
            <a href="assignment.html">
                <i class="fa fa-file"></i> Assignment
            </a>
        </li>


        <li>
            <a href="attendance.html">
                <i class="fa fa-calendar"></i> Attendance
            </a>
        </li>


        <li>
            <a class="active" href="profile.html">
                <i class="fa fa-id-card"></i> Profile
            </a>
        </li>


        <li>
            <a href="faculty.html">
                <i class="fa fa-users"></i> Faculty
            </a>
        </li>


        <li>
            <a href="contact.html">
                <i class="fa fa-phone"></i> Contact
            </a>
        </li>


    </ul>

</div>




<!-- MAIN AREA -->

<div class="main">


    <!-- TOP BAR -->

    <div class="topbar">

        <h2>Student Profile</h2>

        <button class="btn logout-btn">Logout</button>

       <div class="profile">

    <img class="student-profile" src="images/profile.png" alt="Profile">

    <span class="student-name"></span>                   

</div>

    </div>



    <!-- CONTENT -->


    <section>


        <div class="card">


            <h2>Profile Information</h2>


            <br>


            <fieldset>


                <legend>
                    <b>Student Details</b>
                </legend>


                        <p>
                    <strong>Name:</strong>
                    <span class="student-name"></span>
                </p>

                <p>
                    <strong>Enrollment No:</strong>
                    <span class="student-id"></span>
                </p>

                <p>
                    <strong>Department:</strong>
                    <span class="student-department"></span>
                </p>

                <p>
                    <strong>Semester:</strong>
                    <span class="student-semester"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span class="student-email"></span>
                </p>

                <p>
                    <strong>Phone:</strong>
                    <span class="student-phone"></span>
                </p>


            </fieldset>

            <form id="profileForm" class="mt-4">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="profileName">Name</label>
                        <input type="text" id="profileName" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="studentId">Student ID</label>
                        <input type="text" id="studentId" class="form-control" readonly>
                    </div>
                    <div class="col-md-6">
                        <label for="profileEmail">Email</label>
                        <input type="email" id="profileEmail" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="profileDepartment">Department</label>
                        <input type="text" id="profileDepartment" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="profileSemester">Semester</label>
                        <input type="text" id="profileSemester" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="profileContact">Phone</label>
                        <input type="text" id="profileContact" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="profilePassword">New Password</label>
                        <input type="password" id="profilePassword" class="form-control" placeholder="Optional">
                    </div>
                    <div class="col-md-6">
                        <label for="profilePic">Profile Picture</label>
                        <input type="file" id="profilePic" class="form-control" accept="image/*">
                    </div>
                </div>

                <div class="mt-3 text-center">
                    <img id="profilePreview" src="images/profile.png" alt="Profile" width="90" height="90" style="border-radius:50%; object-fit:cover;">
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn">Save Changes</button>
                </div>
            </form>

        </div>


    </section>




<footer>

    <p>
        © 2026 Student Hub Portal. All Rights Reserved.
    </p>

</footer>



</div>

<script src="javascript/auth.js"></script>
<script src="javascript/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
